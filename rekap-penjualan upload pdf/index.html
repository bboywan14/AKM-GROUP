<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AKM GROUP</title>
  <meta name="description" content="AKM GROUP: rekap penjualan E-Katalog dari Google Sheet, dengan login Gmail.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1b19" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AKM GROUP">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Layar: memuat -->
<div id="boot" class="screen center">
  <div class="spinner" aria-hidden="true"></div>
  <p class="muted">Memuat…</p>
</div>

<!-- Layar: login -->
<div id="login" class="screen center" hidden>
  <div class="login-card">
    <img class="login-logo" src="icons/logo.png" alt="Logo AKM" width="220" height="135">
    <h1 id="login-title">AKM GROUP</h1>
    <p class="muted">Rekap Penjualan E-Katalog. Masuk dengan akun Google yang sudah diberi akses ke spreadsheet penjualan.</p>
    <button id="btn-login" class="btn primary wide" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#fff" d="M21.35 11.1H12v2.98h5.35c-.23 1.4-1.64 4.1-5.35 4.1a5.9 5.9 0 0 1 0-11.8c1.87 0 3.12.8 3.84 1.48l2.6-2.5A9.4 9.4 0 0 0 12 3a9 9 0 1 0 0 18c5.2 0 8.6-3.65 8.6-8.8 0-.6-.07-1.04-.15-1.1z"/></svg>
      <span>Masuk dengan Google</span>
    </button>
    <button id="btn-demo" class="btn ghost wide" type="button" hidden>Lihat mode demo</button>
    <p id="login-msg" class="msg" role="alert" hidden></p>
    <p class="fine muted">Hanya akun dengan peran Editor di spreadsheet yang dapat menambah atau mengubah order.</p>
  </div>
</div>

<!-- Layar: aplikasi -->
<div id="app" hidden>
  <header class="top">
    <div class="brand">
      <img class="brand-logo" src="icons/logo.png" alt="Logo AKM" width="62" height="38">
      <div class="brand-text">
        <strong id="app-title">AKM GROUP</strong>
        <span id="sync-info" class="muted small"></span>
      </div>
    </div>
    <div class="top-actions">
      <button id="btn-refresh" class="icon-btn" type="button" aria-label="Muat ulang data" title="Muat ulang data">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <div class="user">
        <span id="user-email" class="user-email small muted"></span>
        <button id="btn-logout" class="btn small" type="button">Keluar</button>
      </div>
    </div>
  </header>

  <nav id="nav" class="nav" aria-label="Menu utama"></nav>

  <main id="main">
    <div id="banner" class="banner" hidden></div>
    <div id="view"></div>
  </main>
</div>

<!-- Rincian order / form input -->
<div id="drawer" class="drawer" hidden>
  <div class="drawer-backdrop" data-act="close-detail"></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div id="drawer-body"></div>
  </aside>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="config.js"></script>
<script src="logic.js"></script>
<script src="writer.js"></script>
<script src="app.js"></script>
<script src="pdfparse.js"></script>
<script src="drive.js"></script>
<script src="form.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.__gsiReady&&window.__gsiReady()"></script>
</body>
</html>
